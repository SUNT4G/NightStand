<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a09">
  <meta name="description" content="NIGHTSTAND reúne temporizador, checklist diaria y controles de Spotify en una experiencia de escritorio minimalista.">
  <title>NIGHTSTAND — Tu espacio para concentrarte</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a09;
      --panel: #101311;
      --panel-2: #151916;
      --line: rgba(235, 244, 237, .105);
      --text: #f2f5f0;
      --muted: #9aa39b;
      --soft: #c8d0c8;
      --lime: #c7fa72;
      --lime-dark: #8bbf3d;
      --mint: #b5f5db;
      --radius: 24px;
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 78% 8%, rgba(101, 151, 75, .12), transparent 35%),
        radial-gradient(ellipse at 3% 46%, rgba(72, 122, 99, .07), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .wrap { width: min(var(--max), calc(100% - 48px)); margin-inline: auto; }
    .nav-wrap { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(18px); background: rgba(8,10,9,.76); border-bottom: 1px solid rgba(255,255,255,.055); }
    nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 800; letter-spacing: .13em; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; color: #10150b; background: var(--lime); box-shadow: 0 0 26px rgba(199,250,114,.13); }
    .brand-mark svg { width: 19px; height: 19px; }
    .nav-links { display: flex; align-items: center; gap: 30px; color: var(--muted); font-size: 13px; }
    .nav-links a { transition: color .2s ease; }
    .nav-links a:hover { color: var(--text); }
    .nav-contact { border: 1px solid var(--line); padding: 10px 15px; border-radius: 999px; color: var(--text) !important; }
    .nav-contact:hover { border-color: rgba(199,250,114,.6); }
    .hero { min-height: 690px; padding: 86px 0 82px; display: grid; grid-template-columns: .94fr 1.06fr; align-items: center; gap: 66px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--lime); font-size: 11px; text-transform: uppercase; letter-spacing: .2em; font-weight: 750; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--lime); }
    h1 { margin: 24px 0 22px; max-width: 620px; font-size: clamp(46px, 6.3vw, 82px); line-height: .99; letter-spacing: -.075em; font-weight: 730; }
    h1 span { color: var(--lime); }
    .hero-copy { max-width: 500px; color: var(--muted); font-size: 17px; line-height: 1.8; }
    .hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 19px; border-radius: 999px; font-size: 13px; font-weight: 750; transition: transform .2s, background .2s, border-color .2s; cursor: pointer; }
    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--lime); color: #12170b; border: 1px solid var(--lime); }
    .button-primary:hover { background: #d7ff91; }
    .button-secondary { color: var(--text); border: 1px solid var(--line); background: rgba(255,255,255,.025); }
    .button-secondary:hover { border-color: rgba(199,250,114,.4); }
    .button svg { width: 16px; height: 16px; }
    .under-note { margin-top: 22px; color: #69736b; font-size: 11px; letter-spacing: .04em; }

    .product-stage { position: relative; perspective: 1200px; }
    .stage-glow { position: absolute; inset: 12% 3%; background: rgba(156,209,100,.13); filter: blur(65px); border-radius: 50%; pointer-events: none; }
    .app-window { position: relative; overflow: hidden; border: 1px solid rgba(228,239,229,.15); border-radius: 19px; background: #0a0d0b; box-shadow: 0 38px 100px rgba(0,0,0,.56), 0 0 0 7px rgba(255,255,255,.012); transform: rotateY(-5deg) rotateX(1deg); }
    .window-top { height: 38px; background: #111512; border-bottom: 1px solid rgba(255,255,255,.065); display: flex; align-items: center; padding: 0 13px; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #3a423b; }
    .window-title { margin: 0 auto; padding-right: 35px; color: #6f796f; font-size: 9px; letter-spacing: .15em; }
    .app-content { min-height: 395px; display: grid; grid-template-columns: 170px 1fr; }
    .side-panel { padding: 18px 12px 12px; display: flex; flex-direction: column; background: #0e120f; border-right: 1px solid rgba(255,255,255,.065); min-width: 0; }
    .side-label { margin: 0 0 12px; padding: 0 5px; color: #879187; font-size: 8px; letter-spacing: .18em; text-transform: uppercase; }
    .task-row { display: flex; align-items: flex-start; gap: 7px; padding: 7px 5px; color: #b8c0b8; font-size: 9px; line-height: 1.4; }
    .task-box { flex: 0 0 11px; width: 11px; height: 11px; border: 1px solid #596459; border-radius: 3px; margin-top: 1px; }
    .task-box.checked { display: grid; place-items: center; background: var(--lime); border-color: var(--lime); color: #151a0e; font-size: 8px; }
    .task-done { color: #626c63; text-decoration: line-through; }
    .task-input { margin: 9px 5px 15px; padding: 7px; border: 1px dashed #313a32; border-radius: 6px; color: #718071; font-size: 8px; }
    .music-mini { margin-top: auto; padding: 10px 8px; background: #171d18; border: 1px solid rgba(255,255,255,.075); border-radius: 9px; }
    .track { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .album-art { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 5px; background: linear-gradient(145deg,#d8e7a8,#738f54 55%,#304532); display: grid; place-items: center; color: #10180e; font-size: 13px; font-weight: 900; }
    .track-meta { min-width: 0; }
    .track-name { color: #f0f4ed; font-size: 8px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .track-artist { margin-top: 2px; color: #8b978b; font-size: 7px; }
    .music-controls { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 10px 0 8px; color: #acb5ac; }
    .music-controls span { font-size: 10px; }
    .music-controls .play { width: 21px; height: 21px; border-radius: 50%; background: var(--lime); color: #11180b; display: grid; place-items: center; font-size: 8px; padding-left: 1px; }
    .mini-progress { height: 2px; border-radius: 5px; background: #344035; overflow: hidden; }
    .mini-progress i { display: block; width: 43%; height: 100%; background: var(--lime); }
    .timer-panel { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px 14px 30px; min-width: 0; background: radial-gradient(ellipse at 50% 45%, rgba(139,181,82,.065), transparent 48%); }
    .timer-topline { position: absolute; top: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 7px; color: #7f8b7e; font-size: 8px; letter-spacing: .15em; }
    .live-dot { width: 5px; height: 5px; background: var(--lime); border-radius: 50%; box-shadow: 0 0 10px rgba(199,250,114,.7); }
    .timer-time { color: var(--lime); font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: clamp(38px, 5vw, 59px); font-weight: 500; letter-spacing: -.09em; text-shadow: 0 0 28px rgba(199,250,114,.13); white-space: nowrap; }
    .timer-caption { margin-top: 11px; color: #879187; font-size: 8px; letter-spacing: .2em; text-transform: uppercase; }
    .timer-rule { height: 1px; width: 65%; margin: 28px 0 17px; background: linear-gradient(90deg, transparent, #384337, transparent); }
    .timer-buttons { display: flex; align-items: center; gap: 8px; }
    .timer-btn { padding: 7px 11px; color: #b1bab0; border: 1px solid #2c352d; border-radius: 6px; font-size: 8px; }
    .timer-btn.active { background: rgba(199,250,114,.08); border-color: rgba(199,250,114,.35); color: var(--lime); }
    .app-foot { position: absolute; bottom: 12px; color: #59655a; font-size: 7px; letter-spacing: .12em; }
    .floating-tag { position: absolute; right: -17px; bottom: 36px; display: flex; align-items: center; gap: 9px; padding: 12px 15px; border: 1px solid rgba(199,250,114,.17); border-radius: 12px; background: rgba(17,22,18,.94); box-shadow: 0 15px 45px rgba(0,0,0,.35); font-size: 10px; color: #dce4d8; }
    .tag-icon { width: 25px; height: 25px; display: grid; place-items: center; background: rgba(199,250,114,.12); color: var(--lime); border-radius: 8px; }

    .trusted-strip { border-block: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.014); }
    .strip-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 0; color: #737d74; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; }
    .strip-item { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    .strip-item svg { color: var(--lime); width: 15px; height: 15px; }
    section.content-section { padding: 108px 0; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 30px; margin-bottom: 42px; }
    .section-kicker { color: var(--lime); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; }
    h2 { max-width: 620px; margin: 14px 0 0; font-size: clamp(32px, 4.5vw, 52px); line-height: 1.05; letter-spacing: -.055em; font-weight: 650; }
    .section-desc { max-width: 345px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .feature-card { min-height: 250px; padding: 25px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.012)); transition: border-color .2s, transform .2s; }
    .feature-card:hover { transform: translateY(-4px); border-color: rgba(199,250,114,.3); }
    .feature-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid rgba(199,250,114,.22); border-radius: 13px; background: rgba(199,250,114,.065); color: var(--lime); }
    .feature-icon svg { width: 20px; height: 20px; }
    .feature-card h3 { margin: 28px 0 10px; font-size: 18px; letter-spacing: -.025em; }
    .feature-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .manifesto { padding: 48px; border-radius: 28px; border: 1px solid rgba(199,250,114,.14); background: radial-gradient(ellipse at 90% 20%, rgba(124,173,74,.13), transparent 45%), #0f130f; display: grid; grid-template-columns: .85fr 1.15fr; gap: 35px; align-items: center; }
    .manifesto-label { color: var(--lime); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .manifesto h2 { font-size: clamp(30px, 4vw, 44px); }
    .manifesto-copy { color: #aab4a9; font-size: 14px; line-height: 1.9; }
    .manifesto-copy p { margin-top: 0; }
    .manifesto-copy p:last-child { margin-bottom: 0; }
    .contact-section { padding: 0 0 100px; }
    .contact-card { position: relative; overflow: hidden; padding: 58px; display: flex; justify-content: space-between; align-items: center; gap: 30px; border: 1px solid rgba(255,255,255,.1); border-radius: 28px; background: linear-gradient(120deg, #151a15, #0f120f); }
    .contact-card::after { content: ""; position: absolute; width: 290px; height: 290px; right: 17%; top: -170px; border: 1px solid rgba(199,250,114,.12); border-radius: 50%; box-shadow: 0 0 0 35px rgba(199,250,114,.018), 0 0 0 70px rgba(199,250,114,.014); pointer-events: none; }
    .contact-card h2 { margin-top: 12px; }
    .contact-card p { margin-bottom: 0; color: var(--muted); font-size: 14px; }
    .contact-actions { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
    footer { border-top: 1px solid rgba(255,255,255,.07); }
    .footer-inner { min-height: 100px; display: flex; align-items: center; justify-content: space-between; gap: 20px; color: #788178; font-size: 11px; }
    .credits { color: #c2cbc0; }
    .credits strong { color: var(--lime); font-weight: 750; }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a:hover { color: var(--text); }
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .release-section { padding-top: 20px; }
    .release-grid { display: grid; grid-template-columns: 1.08fr .92fr; gap: 16px; align-items: stretch; }
    .release-card { border: 1px solid var(--line); border-radius: 26px; background: linear-gradient(150deg, rgba(255,255,255,.035), rgba(255,255,255,.012)); padding: clamp(25px, 4vw, 42px); }
    .release-card h3 { margin: 14px 0 15px; font-size: clamp(24px, 3vw, 34px); line-height: 1.12; letter-spacing: -.05em; }
    .release-card p { color: var(--muted); font-size: 14px; line-height: 1.85; }
    .release-card p:last-child { margin-bottom: 0; }
    .release-lede { color: var(--text) !important; font-size: 16px !important; }
    .release-quote { margin: 22px 0; border-left: 2px solid var(--lime); padding: 3px 0 3px 17px; font-size: 15px; color: #e4eadf; }
    .release-quote strong { color: var(--lime); }
    .download-card { display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(ellipse at 90% 0%, rgba(199,250,114,.13), transparent 43%), #101510; border-color: rgba(199,250,114,.17); }
    .release-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: var(--lime); background: rgba(199,250,114,.09); border: 1px solid rgba(199,250,114,.18); }
    .release-icon svg { width: 23px; height: 23px; }
    .release-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 24px; }
    .meta-pill { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.025); border-radius: 999px; padding: 6px 10px; color: #b6c0b5; font-size: 10px; letter-spacing: .04em; }
    .download-card .button { width: 100%; margin-top: 5px; }
    .download-note { font-size: 11px !important; color: #758174 !important; }
    .spotify-guide { display: grid; grid-template-columns: .72fr 1.28fr; gap: 45px; align-items: start; }
    .spotify-aside { position: sticky; top: 105px; }
    .spotify-aside h2 { margin-bottom: 17px; }
    .spotify-aside p { color: var(--muted); font-size: 14px; line-height: 1.8; }
    .guide-steps { display: grid; gap: 12px; }
    .guide-step { display: grid; grid-template-columns: 42px 1fr; gap: 15px; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.018); }
    .step-number { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: rgba(199,250,114,.08); border: 1px solid rgba(199,250,114,.17); color: var(--lime); font-size: 12px; font-weight: 800; }
    .guide-step h3 { margin: 2px 0 7px; font-size: 15px; letter-spacing: -.02em; }
    .guide-step p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .inline-code { display: inline-block; max-width: 100%; overflow-wrap: anywhere; margin: 7px 0; padding: 7px 9px; border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.22); border-radius: 7px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; color: #d9e6d1; }
    .spotify-warning { margin-top: 15px; padding: 18px 20px; border: 1px solid rgba(244,194,115,.16); border-radius: 16px; background: rgba(244,194,115,.045); color: #c7bdab; font-size: 12px; line-height: 1.8; }
    .spotify-warning strong { color: #f0d29e; }
    .spotify-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 17px; }
    .text-link { color: var(--lime); font-size: 12px; font-weight: 700; border-bottom: 1px solid rgba(199,250,114,.32); padding-bottom: 3px; }

    /* Estilo para la notificación flotante de copiado */
    #copy-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #171d18;
      color: var(--lime);
      border: 1px solid rgba(199,250,114,0.35);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 1000;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
    }
    #copy-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .release-grid, .spotify-guide { grid-template-columns: 1fr; }
      .spotify-aside { position: static; }
    }
    @media (max-width: 620px) {
      .release-section { padding-top: 0; }
      .release-card { padding: 25px; border-radius: 22px; }
      .guide-step { grid-template-columns: 34px 1fr; padding: 17px; gap: 12px; }
      .step-number { width: 32px; height: 32px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } .reveal { opacity: 1; transform: none; } }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; gap: 54px; padding-top: 68px; }
      .hero-copy { max-width: 600px; }
      .product-stage { width: min(100%, 650px); margin-inline: auto; }
      .section-head { align-items: start; flex-direction: column; gap: 12px; }
      .section-desc { max-width: 600px; }
      .manifesto { grid-template-columns: 1fr; padding: 35px; gap: 20px; }
      .contact-card { align-items: flex-start; flex-direction: column; padding: 40px; }
      .floating-tag { right: -6px; }
    }
    @media (max-width: 620px) {
